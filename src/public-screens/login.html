<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Job & Project Portal</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your talent or admin dashboard</p>
            </div>

            <div id="error-banner" class="error-banner" style="display: none;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="e.g. talent@gmail.com or admin@portal.com">
                    <small class="hint">Tip: Type an email containing <strong>admin</strong> for administrator access.</small>
                </div>
                 
        <div class="form-group">
    
                    <label for="password">Password</label>
                <div style="position: relative; display: flex; align-items: center;">
                   <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding-right: 2.5rem;">
                   <button type="button" id="toggle-password" style="position: absolute; right: 0.75rem; background: none; border: none; cursor: pointer; font-size: 1rem;" title="Show/Hide Password">👁️</button>
                 </div>
        </div>

                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create Account</a></p>
                <p style="margin-top: 0.5rem;"><a href="../../index.html">← Back to Public Job Feed</a></p>
            </div>
        </div>
    </div>

    <!-- Linked compiled JavaScript output -->
     <script type="module" src="/public-screens/login.js"></script>
</body>
</html>
